name: release

# Opt-in releases: a push to main whose commit message contains [release] is tagged
# as the next version once the tests pass. Packagist picks the tag up through its
# webhook. Every other push is just saved work.
#
#   [release]          patch   v0.3.0 -> v0.3.1
#   [release] [minor]  minor   v0.3.1 -> v0.4.0
#   [release] [major]  major   v0.4.0 -> v1.0.0

on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Tag the next version
        env:
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "This commit is already released."; exit 0
          fi

          if ! echo "$MESSAGE" | grep -qi '\[release\]'; then
            echo "No [release] in the commit message: nothing to release."; exit 0
          fi

          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"

          if echo "$MESSAGE" | grep -qi '\[major\]'; then
            next="v$((major + 1)).0.0"
          elif echo "$MESSAGE" | grep -qi '\[minor\]'; then
            next="v${major}.$((minor + 1)).0"
          else
            next="v${major}.${minor}.$((patch + 1))"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "Release $next"
          git push origin "$next"
          echo "Released $next (previous: $latest)"
